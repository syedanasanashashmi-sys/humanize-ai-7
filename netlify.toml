[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route all /api/* requests to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Fallback so refreshing any client route (/humanizer, /faq, /about, etc.) never gives a 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
